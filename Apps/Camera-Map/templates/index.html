<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangkok CCTV Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.88);
      --border: rgba(148, 163, 184, 0.25);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif; }
    #map { position: absolute; inset: 0; }

    .title-card {
      position: absolute; top: 12px; left: 56px; z-index: 1000;
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 14px; backdrop-filter: blur(6px); max-width: calc(100% - 120px);
    }
    .title-card h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
    .title-card p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

    .coords {
      position: absolute; bottom: 24px; left: 12px; z-index: 1000;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 4px 10px; font: 12px ui-monospace, Consolas, monospace; color: var(--accent);
    }
    .leaflet-control-layers { border-radius: 10px !important; }
    .tiles-dark { filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9); }

    /* Camera popup */
    .leaflet-popup-content-wrapper { border-radius: 12px; }
    .leaflet-popup-content { margin: 12px; width: 300px !important; }
    .cam-popup { font-size: 12px; color: #0f172a; }
    .cam-popup .cam-id {
      display: inline-block; font: 600 11px ui-monospace, Consolas, monospace;
      background: #dbeafe; color: #1d4ed8; border-radius: 6px; padding: 2px 6px;
    }
    .cam-popup h2 { margin: 6px 0 2px; font-size: 14px; line-height: 1.3; }
    .cam-popup .detail { margin: 0 0 8px; color: #475569; line-height: 1.35; }
    .cam-popup .snapshot {
      width: 100%; aspect-ratio: 352 / 288; object-fit: cover; display: block;
      border-radius: 8px; background: #e2e8f0;
    }
    .cam-popup .no-image {
      display: flex; align-items: center; justify-content: center; aspect-ratio: 352 / 288;
      border-radius: 8px; background: #f1f5f9; color: #64748b;
    }
    .cam-popup .meta {
      display: flex; justify-content: space-between; gap: 8px; margin-top: 6px;
      color: #64748b; font: 11px ui-monospace, Consolas, monospace;
    }
    .cam-tooltip { font-size: 12px; }

    .status-error { color: #fca5a5 !important; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="title-card">
    <h1>Bangkok CCTV Camera Map</h1>
    <p id="status">Loading cameras…</p>
  </div>
  <div class="coords" id="coords">13.75630, 100.50180</div>

  <script>
    // Bangkok city center (Democracy Monument area)
    const BANGKOK_CENTER = [13.7563, 100.5018];

    const map = L.map('map', { zoomControl: true }).setView(BANGKOK_CENTER, 12);

    // Free base layers (no API key needed)
    const baseLayers = {
      'Streets (OpenStreetMap)': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }),
      // Same OSM tiles, darkened with a CSS filter (see .tiles-dark)
      'Dark (OpenStreetMap)': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, className: 'tiles-dark',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }),
      'Satellite (Esri)': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'
      })
    };

    baseLayers['Streets (OpenStreetMap)'].addTo(map);
    L.control.layers(baseLayers, null, { position: 'topright', collapsed: false }).addTo(map);
    L.control.scale({ metric: true, imperial: false }).addTo(map);

    // Live cursor coordinates (handy when checking camera lat/lon later)
    const coordsEl = document.getElementById('coords');
    map.on('mousemove', e => {
      coordsEl.textContent = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
    });

    // ---------- Camera pins ----------
    const statusEl = document.getElementById('status');
    const cameraLayer = L.featureGroup().addTo(map);

    const PIN_STYLE = {
      radius: 7, weight: 2, color: '#ffffff',
      fillColor: '#2563eb', fillOpacity: 0.95
    };
    const PIN_STYLE_NO_IMAGES = { ...PIN_STYLE, fillColor: '#94a3b8' };
    const PIN_STYLE_HOVER = { radius: 10 };

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    // "..._20260831_235012.jpg" -> "2026-08-31 23:50"
    function timestampFromFilename(name) {
      const m = /_(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})\d{2}\.jpg$/i.exec(name || '');
      return m ? `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}` : '';
    }

    function cameraTitle(cam) {
      return cam.name_en || cam.name_th || `Camera ${cam.camera_id}`;
    }

    function popupHtml(cam) {
      const detail = cam.name_en ? cam.detail_en : cam.detail_th;
      const img = cam.latest_image
        ? `<img class="snapshot" loading="lazy" alt="Latest snapshot from camera ${escapeHtml(cam.camera_id)}"
             src="/images/${encodeURIComponent(cam.camera_id)}/${encodeURIComponent(cam.latest_image)}">`
        : `<div class="no-image">No images for this camera</div>`;
      return `
        <div class="cam-popup">
          <span class="cam-id">CAM ${escapeHtml(cam.camera_id)}</span>
          <h2>${escapeHtml(cameraTitle(cam))}</h2>
          ${detail ? `<p class="detail">${escapeHtml(detail)}</p>` : ''}
          ${img}
          <div class="meta">
            <span>${escapeHtml(timestampFromFilename(cam.latest_image) || '—')}</span>
            <span>${cam.image_count} snapshots</span>
          </div>
          <div class="meta">
            <span>${cam.latitude.toFixed(5)}, ${cam.longitude.toFixed(5)}</span>
          </div>
        </div>`;
    }

    async function loadCameras() {
      try {
        const res = await fetch('/api/cameras');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        data.cameras.forEach(cam => {
          const base = cam.image_count ? PIN_STYLE : PIN_STYLE_NO_IMAGES;
          const marker = L.circleMarker([cam.latitude, cam.longitude], base)
            .bindTooltip(`<b>${escapeHtml(cam.camera_id)}</b> · ${escapeHtml(cameraTitle(cam))}`,
                         { direction: 'top', offset: [0, -8], className: 'cam-tooltip' })
            .bindPopup(() => popupHtml(cam), { maxWidth: 330, autoPanPadding: [40, 40] });
          marker.on('mouseover', () => marker.setStyle(PIN_STYLE_HOVER));
          marker.on('mouseout', () => marker.setStyle({ radius: base.radius }));
          marker.addTo(cameraLayer);
        });

        if (data.cameras.length) {
          map.fitBounds(cameraLayer.getBounds(), { padding: [60, 60] });
        }
        statusEl.textContent = `${data.cameras.length} cameras · click a pin to see its latest snapshot`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Could not load cameras. Is the server running?';
        statusEl.classList.add('status-error');
      }
    }

    loadCameras();
  </script>
</body>
</html>
